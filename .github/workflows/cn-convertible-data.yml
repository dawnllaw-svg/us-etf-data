name: CN convertible bond data
on:
  schedule:
    - cron: '45 8 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [probe, snapshot, bulk]
        default: snapshot
permissions:
  contents: write
concurrency:
  group: cn-convertible-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      FETCH_MODE: ${{ inputs.mode || 'snapshot' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas pyarrow akshare
      - run: python -m unittest discover -s tests -v
      - name: Restore validated snapshot history
        if: env.FETCH_MODE != 'probe'
        run: python release_data.py restore cn-cb-
      - name: Fetch
        run: python -u fetch_cn_convertible.py "$FETCH_MODE"
      - name: Publish complete snapshot without deleting old releases
        if: env.FETCH_MODE != 'probe'
        run: |
          TAG="cn-cb-$(date -u +%F)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python release_data.py publish "$TAG" --pattern 'cb_*'
