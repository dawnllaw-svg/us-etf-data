name: Update US ETF data

on:
  schedule:
    - cron: "30 22 * * 1-5"   # 每个交易日美股收盘后 (UTC 22:30)
  workflow_dispatch: {}        # 允许手动触发

permissions:
  contents: write

concurrency:
  group: etf-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - run: python -m unittest discover -s tests -v
      - run: python download.py
      - name: Commit and push if changed
        run: |
          git config user.name "etf-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add us_etf_daily.csv cn_etf_daily.csv us_etf_daily_quality.json cn_etf_daily_quality.json
          git diff --cached --quiet || git commit -m "data update $(date -u +%F)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            sleep $((i * 3))
          done
          exit 1
