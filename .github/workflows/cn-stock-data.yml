name: CN stock data (monthly)
on:
  schedule:
    - cron: '30 0 1-3 * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: cn-stock-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas akshare baostock
      - run: python -m unittest discover -s tests -v
      - name: Restore validated baseline
        run: python release_data.py restore cn-stock-
      - name: Refresh historical universe and financial statements
        run: timeout 45m python -u update_cn_stock_monthly.py
      - name: Publish complete snapshot
        run: |
          TAG="cn-stock-$(date -u +%F)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python release_data.py publish "$TAG"
          printf '{"release_tag":"%s","updated_utc":"%s"}\n' "$TAG" "$(date -u +%FT%TZ)" > cn_stock_manifest.json
          git config user.name 'etf-data-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add cn_stock_manifest.json
          git diff --cached --quiet || git commit -m "cn stock manifest $TAG"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            sleep $((i * 3))
          done
          exit 1
